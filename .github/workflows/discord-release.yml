name: Discord Release
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          title: "🚀 Novo release: ${{ github.event.release.tag_name }}"
          description: "${{ github.event.release.body || 'Sem descrição' }}"
          color: 5814783
          fields: '[{"name": "Repo", "value": "${{ github.repository }}", "inline": true}, {"name": "📥 Download APK", "value": "[Assets do release](${{ github.event.release.html_url }})", "inline": true}]'
          username: "GitHub Releases"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"