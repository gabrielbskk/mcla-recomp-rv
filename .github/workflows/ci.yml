name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check pins, patches, links to game data, and Python syntax
        run: python3 -I scripts/ci/check_pins.py

      - name: Check shell syntax
        run: sh -n scripts/ci/host_compile_android.sh scripts/build_android_apk.sh scripts/build_adrenotools_android.sh

  android-sdk-and-host:
    name: Android SDK and host stub
    # The SDK build is intentionally limited to pull requests and manual runs;
    # lightweight repository checks still run on every push.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: 30.0.16248370
      ANDROID_PLATFORM: android-35
      SDK_COMMIT: f5337cdc947ff6d4c4196737e2c807a48f2a1fc2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;$ANDROID_PLATFORM" "ndk;$ANDROID_NDK_VERSION"

      - name: Check NDK floating-point charconv support
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          cat <<'CPP' | "$toolchain/bin/clang++" --target=aarch64-none-linux-android35 \
            --sysroot="$toolchain/sysroot" -std=c++23 -fsyntax-only -x c++ -
          #include <charconv>
          void check(const char* first, const char* last) {
            float f;
            double d;
            (void)std::from_chars(first, last, f, std::chars_format::general);
            (void)std::from_chars(first, last, d, std::chars_format::general);
          }
          CPP

      - name: Clone the pinned ReXGlue SDK and apply Android patches
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/rexglue-sdk"
          git clone --recursive https://github.com/rexglue/rexglue-sdk.git "$sdk"
          git -C "$sdk" checkout "$SDK_COMMIT"
          git -C "$sdk" submodule update --init --recursive
          for patch in \
            rexglue-android-arm64.patch \
            rexglue-turnip-loader.patch \
            rexglue-driver-cache-path.patch \
            rexglue-vulkan-pipeline-background-work.patch \
            rexglue-vulkan-occlusion-query-pipeline-wait.patch \
            rexglue-android-present-filters.patch \
            rexglue-android-sdl-event-pump.patch \
            rexglue-pipeline-storage-layout.patch \
            rexglue-android-present-stats.patch \
            rexglue-vulkan-frame-start-sync.patch \
            rexglue-android-bionic-link.patch \
            rexglue-android-driver-selection.patch \
            rexglue-android-stereo-diagnostic.patch; do
            git -C "$sdk" apply "$GITHUB_WORKSPACE/patches/$patch"
          done

      - name: Build and install the patched SDK for arm64-v8a
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/rexglue-sdk"
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          cmake -S "$sdk" -B "$sdk/out/build/android-arm64" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE=Release \
            -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_USE_D3D12=OFF \
            -DREXGLUE_ENABLE_FSR=OFF \
            -DCMAKE_INSTALL_PREFIX="$sdk/out/install/android-arm64"
          cmake --build "$sdk/out/build/android-arm64" --parallel
          cmake --install "$sdk/out/build/android-arm64"

      - name: Compile host sources with generated-header stand-ins
        run: |
          MCLA_HOST_CHECK_NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" \
            scripts/ci/host_compile_android.sh "$RUNNER_TEMP/rexglue-sdk/out/install/android-arm64"
