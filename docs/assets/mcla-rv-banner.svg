<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">MCLA Recomp RV — Los Angeles, recompiled.</title>
  <desc id="desc">A midnight graphite and sunset amber banner with a city skyline, sweeping road lines and a racing-inspired RV emblem. Unofficial Android ARM64 community port.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1">
      <stop stop-color="#171b24"/>
      <stop offset="0.6" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#24202a"/>
    </linearGradient>
    <radialGradient id="sunset">
      <stop stop-color="#f59e42" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#f59e42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber">
      <stop stop-color="#ffd18b"/>
      <stop offset="1" stop-color="#f08a3c"/>
    </linearGradient>
    <linearGradient id="road">
      <stop stop-color="#f59e42" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#f59e42" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd18b"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="418" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#night)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <ellipse cx="1060" cy="250" rx="540" ry="350" fill="url(#sunset)"/>
    <g fill="#080d15" opacity="0.6">
      <path d="M712 310V234H750V205H774V257H804V174H840V144H850V174H874V228H903V190H940V251H968V218H995V127H1005V112H1012V127H1037V177H1055V231H1080V196H1118V148H1158V213H1186V188H1224V242H1280V420H712Z"/>
    </g>
    <g fill="#f7b466" opacity="0.18">
      <path d="M816 190H822V196H816ZM838 190H844V196H838ZM816 214H822V220H816ZM838 238H844V244H838ZM1008 150H1014V156H1008ZM1008 174H1014V180H1008ZM1008 198H1014V204H1008ZM1132 168H1138V174H1132ZM1146 192H1152V198H1146Z"/>
    </g>
    <g fill="none">
      <circle cx="1045" cy="207" r="166" stroke="#f6ae62" stroke-opacity="0.1"/>
      <circle cx="1045" cy="207" r="142" stroke="#f6ae62" stroke-opacity="0.2" stroke-dasharray="2 12"/>
      <circle cx="1045" cy="207" r="119" stroke="#f6ae62" stroke-opacity="0.32" stroke-width="2" stroke-dasharray="160 590" transform="rotate(-65 1045 207)"/>
      <path d="M610 450C780 270 1070 440 1330 130" stroke="url(#road)" stroke-width="2"/>
      <path d="M680 450C850 285 1100 440 1330 180" stroke="url(#road)" stroke-width="1" opacity="0.4"/>
      <path d="M-20 398H1300" stroke="#ffffff" stroke-opacity="0.06"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="60" y="52" width="30" height="4" rx="2" fill="url(#amber)"/>
      <text x="104" y="60" fill="#e9b77b" font-size="13" font-weight="700" letter-spacing="4">UNOFFICIAL COMMUNITY PORT</text>
      <text x="55" y="179" fill="#f3f4f7" font-size="83" font-weight="900" letter-spacing="-4">MCLA RECOMP</text>
      <text x="61" y="228" fill="#eab97f" font-size="22" font-weight="700" letter-spacing="5">LOS ANGELES, RECOMPILED.</text>
      <text x="62" y="274" fill="#99a3b4" font-size="17">Midnight Club: Los Angeles Complete Edition</text>
      <rect x="60" y="313" width="158" height="35" rx="8" fill="#f5a34d" fill-opacity="0.1" stroke="#f5a34d" stroke-opacity="0.3"/>
      <text x="139" y="336" fill="#f1c38a" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">ANDROID ARM64</text>
      <text x="242" y="336" fill="#99a3b4" font-size="12" font-weight="700" letter-spacing="2">VULKAN / SDL3 / ReXGlue</text>
      <g transform="translate(1045 207) skewX(-12)">
        <text y="24" fill="url(#amber)" font-size="104" font-weight="900" text-anchor="middle" letter-spacing="-7">RV</text>
      </g>
      <text x="1045" y="266" fill="#a99b8c" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="4">STATIC RECOMPILATION</text>
      <text x="62" y="389" fill="#748094" font-size="10" font-weight="700" letter-spacing="2">EXPERIMENTAL SOFTWARE. ORIGINAL GAME FILES REQUIRED.</text>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="418" rx="24" fill="none" stroke="#7d899f" stroke-opacity="0.2"/>
</svg>
